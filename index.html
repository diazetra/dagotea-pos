<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dago Téa POS</title>
  <meta name="description" content="Aplikasi Kasir, Dapur dan Laporan Harian Warung Dago Téa">
  <meta name="theme-color" content="#023422">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dago Téa POS">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #023422;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #FAF7F2;
      display: block;
    }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #023422;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      transition: opacity 0.25s ease;
    }
    .splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      border: 2px solid #CD953F;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
    }
    .splash-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.01em;
    }
    .splash-sub {
      margin: 0;
      font-size: 14px;
      color: #F3D39B;
    }
    .btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid transparent;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:focus-visible {
      outline: 2px solid #F3D39B;
      outline-offset: 2px;
    }
    .btn-gold {
      background: #F3D39B;
      color: #023422;
      border-color: #CD953F;
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.35);
    }
    .fallback-link {
      margin-top: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .fallback-link.show {
      opacity: 1;
      pointer-events: auto;
    }
    .install-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 30;
      max-width: 460px;
      margin: 0 auto;
      background: #023422;
      color: #FFFFFF;
      border: 1.5px solid #CD953F;
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
    }
    .install-bar.hidden, .offline-box.hidden { display: none; }
    .install-bar img {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      flex-shrink: 0;
    }
    .install-copy {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      line-height: 1.3;
    }
    .install-copy strong { display: block; font-size: 14px; color: #FFFFFF; }
    .install-copy span { color: #F3D39B; }
    .install-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .offline-box {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #023422;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .splash, .fallback-link { transition: none !important; }
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    class="app-frame"
    title="Dago Téa POS"
    src="https://script.google.com/macros/s/AKfycbzt73Dbbq1MMoqImS8kw9hgJYYcq8W0QSclZ6WFJhavGK-hTqEJVKIP9y9-cnIysm-r/exec"
    allow="autoplay; clipboard-write; clipboard-read"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <div id="splash" class="splash" role="status" aria-live="polite">
    <img class="splash-logo" src="./icons/icon-192.png" alt="Logo Dago Téa">
    <h1 class="splash-title">Dago Téa POS</h1>
    <p class="splash-sub">Menghubungkan ke kasir dan dapur...</p>
    <a
      id="fallbackLink"
      class="btn btn-gold fallback-link"
      href="https://script.google.com/macros/s/AKfycbzt73Dbbq1MMoqImS8kw9hgJYYcq8W0QSclZ6WFJhavGK-hTqEJVKIP9y9-cnIysm-r/exec"
      rel="noopener"
    >Buka Aplikasi Langsung</a>
  </div>

  <div id="offlineBox" class="offline-box hidden" role="alert">
    <img class="splash-logo" src="./icons/icon-192.png" alt="Logo Dago Téa">
    <h2 class="splash-title">Koneksi Internet Terputus</h2>
    <p class="splash-sub">Aktifkan Wi-Fi atau data seluler untuk sinkron dengan Google Sheets.</p>
    <button type="button" id="btnRetryNet" class="btn btn-gold">Coba Muat Ulang</button>
  </div>

  <div id="installBar" class="install-bar hidden" role="region" aria-label="Pasang aplikasi">
    <img src="./icons/icon-192.png" alt="">
    <div class="install-copy">
      <strong>Pasang Dago Téa POS</strong>
      <span>Muncul di layar utama dengan logo resmi</span>
    </div>
    <div class="install-actions">
      <button type="button" id="btnInstallDismiss" class="btn btn-ghost" style="padding:0 12px;">Nanti</button>
      <button type="button" id="btnInstallNow" class="btn btn-gold" style="padding:0 14px;">Pasang</button>
    </div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      var splash = document.getElementById('splash');
      var fallback = document.getElementById('fallbackLink');
      var offlineBox = document.getElementById('offlineBox');
      var installBar = document.getElementById('installBar');
      var deferredPrompt = null;
      var loaded = false;

      function hideSplash() {
        loaded = true;
        splash.classList.add('fade-out');
        setTimeout(function () { splash.style.display = 'none'; }, 280);
      }

      frame.addEventListener('load', hideSplash);
      setTimeout(function () {
        if (!loaded) fallback.classList.add('show');
      }, 4500);

      function syncOnlineState() {
        var online = navigator.onLine !== false;
        offlineBox.classList.toggle('hidden', online);
      }
      window.addEventListener('online', function () {
        syncOnlineState();
        frame.src = frame.src;
      });
      window.addEventListener('offline', syncOnlineState);
      syncOnlineState();

      document.getElementById('btnRetryNet').addEventListener('click', function () {
        syncOnlineState();
        if (navigator.onLine !== false) frame.src = frame.src;
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }

      window.addEventListener('beforeinstallprompt', function (ev) {
        ev.preventDefault();
        deferredPrompt = ev;
        installBar.classList.remove('hidden');
      });

      document.getElementById('btnInstallNow').addEventListener('click', function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          installBar.classList.add('hidden');
        });
      });

      document.getElementById('btnInstallDismiss').addEventListener('click', function () {
        installBar.classList.add('hidden');
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        installBar.classList.add('hidden');
      });
    })();
  </script>
</body>
</html>
